<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MSF and CPJ Birthday Fundraiser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#14121a;--tx:#f2f2f2;--lab:#d58bdd;--rule:#b04dba;--card:#211c28;--dim:#6b6577;--g:#92d050;--rem:#3b2c42;--hd:'Hunger Games','Orbitron',Impact,sans-serif;--num:'OPTIBankGothic-Medium','OPTIBankGothic','Michroma','Orbitron',sans-serif}
html,body{background:var(--bg)}body{margin:0;color:var(--tx);font-family:Arial,Helvetica,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:16px}
h1{font:800 clamp(22px,4.5vw,40px)/1.15 var(--hd);text-align:center;margin:8px 0 18px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{text-align:center}
.lab,.sec{font-family:var(--hd);color:var(--lab);font-size:clamp(11px,1.6vw,15px);letter-spacing:.05em;border-bottom:2px solid var(--rule);padding-bottom:4px}
.num{font:clamp(22px,4.5vw,40px) var(--num);padding:8px 0}.goal .num{background:#2e2234}
.bar{height:26px;background:var(--rem);margin:14px 0}.bar i{display:block;height:100%;background:var(--g)}
.sec{text-align:center;margin:18px 0 8px}
.recent{text-align:center;font-size:clamp(14px,2.2vw,17px);line-height:1.7;min-height:5.2em}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--card);color:var(--dim)}.card img{width:100%;display:block;aspect-ratio:660/266;object-fit:cover}
.ch{display:flex;align-items:center;gap:8px;padding:6px 8px;font-family:var(--num);font-size:13px}.ch b{font-size:17px;padding:3px 8px}
.card.on{color:#c9c5d3}.card.on .ch b{background:var(--g);color:var(--bg)}.card.on .ch span{color:var(--tx)}
.card p{margin:0;padding:0 8px;font-size:12px;line-height:1.35;min-height:4.1em}
.st{padding:4px 8px;font-size:12px;font-weight:700}.card.on .st{color:var(--g)}
.card small{display:block;padding:2px 8px 8px;font-size:10px;color:#5c5c66}
.note{text-align:center;color:#5c5c66;font-size:12px}
.admin{margin-top:20px;font-size:14px}.admin input{margin:4px;padding:6px;background:#211c28;color:var(--tx);border:1px solid #444}.admin button{padding:6px 10px;margin:4px}
@media(max-width:760px){.tiles,.cards{grid-template-columns:repeat(2,1fr)}}
.tvlink{display:block;text-align:center;color:#8a7f96;font-size:13px;margin:10px}
.pay{margin:14px 0}
.qrs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:660px;margin:8px auto 0}
.qrs figure{margin:0;text-align:center}
.qrs img{width:100%;display:block;background:#fff;padding:8px;box-sizing:border-box;border-radius:8px}
.qrs figcaption{font-family:var(--hd);color:var(--lab);margin-top:6px;font-size:14px}
body.tv{overflow:hidden;cursor:none;height:100vh;margin:0}
.tv #app{position:absolute;left:0;top:0;width:1920px;height:1080px;max-width:none;box-sizing:border-box;padding:26px 36px;transform-origin:0 0;overflow:hidden;display:grid;grid-template-columns:1fr 330px;grid-template-rows:auto auto auto auto auto auto 1fr;column-gap:28px;row-gap:10px}
.tv #app>*{grid-column:1;min-width:0}
.tv #app>.pay{grid-column:2;grid-row:1/-1;margin:0;min-height:0}
.tv h1{font-size:50px;margin:0;line-height:1.1}
.tv .lab,.tv .sec{font-size:19px;padding-bottom:5px;margin:0}
.tv .tiles{grid-template-columns:repeat(4,1fr);gap:16px}
.tv .num{font-size:52px;padding:4px 0}
.tv .bar{height:34px;margin:0}
.tv .recent{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left;min-height:0;font-size:20px;line-height:1.2}
.tv .recent div{background:#211c28;padding:9px 14px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv .cards{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.tv .card{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tv .card img{flex:1 1 0;min-height:40px;height:auto;aspect-ratio:auto;object-fit:cover}
.tv .ch{flex:none;font-size:17px;padding:6px 10px}.tv .ch b{font-size:21px}
.tv .card p{flex:none;font-size:14px;line-height:1.3;min-height:2.6em;padding:0 10px}
.tv .st{flex:none;font-size:15px;padding:3px 10px}
.tv .card small{flex:none;font-size:11px;padding:1px 10px 6px}
.tv .qrs{grid-template-columns:1fr;gap:10px;max-width:none;margin:8px 0 0}
.tv .qrs figure{display:flex;flex-direction:column;align-items:center}
.tv .qrs img{width:286px;height:286px;padding:8px}
.tv .qrs figcaption{font-size:19px;margin-top:4px}
.tv .note,.tv .tvlink,.tv .admin{display:none}
</style></head><body><div id="app"></div>

const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function render(){
 const app=document.getElementById('app');app.innerHTML='';
 const tot=S.donations.reduce((s,d)=>s+d.a,0),rem=Math.max(0,S.goal-tot);
 app.append($('h1','','MSF and CPJ Birthday Fundraiser'));
 const tiles=$('div','tiles');
 [['RAISED','$'+tot],['CURRENT GOAL','$'+S.goal,'goal'],['REMAINING','$'+rem],['DONORS',S.donations.length]].forEach(([l,v,c])=>{const t=$('div','tile '+(c||''));t.append($('div','lab',l),$('div','num',v));tiles.append(t)});
 const bar=$('div','bar'),fill=$('i');fill.style.width=(tot/Math.max(tot,S.goal)*100)+'%';bar.append(fill);
 const rec=$('div','recent');
 S.donations.slice(-3).reverse().forEach(d=>rec.append($('div','',(d.n||'Anonymous')+'  ·  $'+d.a.toLocaleString()+(d.m?'  ·  '+d.m:''))));
 const grid=$('div','cards');
 CARDS.forEach(([p,n,ds,cr],i)=>{const on=tot>=p,c=$('div','card'+(on?' on':'')),im=$('img'),h=$('div','ch');
  im.src=IMGS[i];im.alt=n;h.append($('b','','$'+p),$('span','',n));
  c.append(im,h,$('p','',ds),$('div','st',on?Math.floor(tot/p)+'× COVERED SO FAR':'UNLOCKS AT $'+p.toLocaleString()),$('small','',cr));grid.append(c)});
 const pay=$('div','pay'),qrs=$('div','qrs');pay.append($('div','sec','SCAN TO DONATE'));
 [['Zelle',Q[0]],['Cash App',Q[1]],['Venmo',Q[2]]].forEach(([n,src])=>{const f=$('figure'),im=$('img');im.src=src;im.alt=n+' QR code';f.append(im,$('figcaption','',n));qrs.append(f)});
 pay.append(qrs);
 app.append(tiles,bar);if(!TV)app.append(pay);
 app.append($('div','sec','RECENT DONATIONS'),rec,$('div','sec','WHAT DONATIONS CAN FUND'),grid,$('p','note','Illustrative examples from MSF, not earmarked purchases.'),Object.assign($('a','tvlink','Open full-screen dashboard'),{href:'?tv'}));
 if(TV)app.append(pay);
 admin();
}
async function admin(){
 if(!window.claude)return;
 const u=await claude.use('user');if(!(u&&(u.isOwner()||u.canEdit())))return;
 const a=await claude.use('artifact');if(!a)return;
 const f=$('details','admin');f.append($('summary','','Owner: add donation or change goal'));
 const mk=(ph,t)=>{const i=$('input');i.placeholder=ph;i.type=t||'text';return i};
 const n=mk('Donor name'),am=mk('Amount','number'),m=mk('Message'),g=mk('New goal','number'),an=$('input'),lb=$('label','','Anonymous ');
 an.type='checkbox';lb.append(an);
 const add=$('button','','Add donation'),sg=$('button','','Set goal'),msg=$('span');
 const save=async()=>{try{const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';
  c.querySelector('#state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');await a.publish('<!doctype html>'+c.outerHTML)}catch(e){msg.textContent='Could not save: '+(e.code||e.message)}};
 add.onclick=()=>{const v=parseFloat(am.value);if(v>0){S.donations.push({n:an.checked?'':n.value.trim(),a:v,m:m.value.trim()});save()}};
 sg.onclick=()=>{const v=parseFloat(g.value);if(v>0){S.goal=v;save()}};
 f.append(n,am,m,lb,add,g,sg,msg);document.getElementById('app').append(f);
}
const SHEET='https://docs.google.com/spreadsheets/d/e/2PACX-1vSdbbKrSPwaIU_-2yb3rxBZjK7xouP74057V_mnlI1GrsLqbNgj8L8stUqxrW5kpxCL0dVIKhZ-WRTi/pub?gid=202011220&single=true&output=csv';
function csv(t){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}else if(h=='"')q=true;else if(h==','){r.push(c);c=''}else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=h}if(c||r.length){r.push(c);rows.push(r)}return rows}
function fromSheet(t){const rows=csv(t),hd=(rows[0]||[]).map(x=>x.trim().toLowerCase()),ix=k=>hd.indexOf(k);
 if(ix('amount')<0)return null;
 const out={donations:[]};
 rows.slice(1).forEach(r=>{const a=parseFloat((r[ix('amount')]||'').replace(/[$,\s]/g,''));if(!(a>0))return;
  const an=/^(y|yes|true|x|1)/i.test((r[ix('anon')]||'').trim());
  out.donations.push({n:an?'':(r[ix('name')]||'').trim(),a:a,m:(r[ix('message')]||'').trim()})});
